name: Daily market data update

on:
  schedule:
    # 23:15 UTC is after the regular US market close year-round.
    - cron: "15 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch, validate, and build features
        env:
          MARKET_SYMBOLS: SPY,QQQ,IWM,AAPL,NVDA
        run: python -m src.market_pipeline.pipeline

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Commit new trading data
        run: |
          if [ -z "$(git status --porcelain -- data metadata)" ]; then
            echo "No new market data to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data metadata
          git diff --cached --quiet && exit 0
          git commit -m "Update market data for $(date -u +%F)"
          git push
