name: Five-day SPY model evaluation

on:
  schedule:
    - cron: "30 14 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: five-day-spy-model-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ML dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Evaluate five-day SPY models
        run: python -m src.market_ml.experiment

      - name: Commit evaluation artifacts
        run: |
          if git diff --quiet -- models; then
            echo "Evaluation artifacts are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models
          git commit -m "Evaluate five-day SPY models"
          git push

